name: Pillio
options:
  bundleIdPrefix: fr.local
  deploymentTarget:
    iOS: "15.0"
targets:
  MonTraitement:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.local.Pillio
        PRODUCT_NAME: Pillio
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_CFBundleDisplayName: Pillio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
